<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Fast Track - 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Abhaya+Libre:wght@700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: white; }
        .sinhala-font { font-family: 'Abhaya Libre', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .countdown-box { background: linear-gradient(135deg, #f59e0b, #d97706); }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-screen" class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-extrabold text-yellow-500 mb-2">A/L Fast Track</h1>
        <div class="w-full max-w-sm glass-card p-8 rounded-3xl shadow-2xl">
            <h2 id="auth-title" class="text-xl font-bold mb-6">Login</h2>
            <div id="register-fields" class="hidden">
                <input type="text" id="reg-name" placeholder="ඔබේ නම" class="w-full p-4 mb-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-yellow-500 text-white">
            </div>
            <input type="email" id="auth-email" placeholder="Email ලිපිනය" class="w-full p-4 mb-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-yellow-500 text-white">
            <input type="password" id="auth-password" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-yellow-500 text-white">
            <button onclick="handleAuth()" id="auth-btn" class="w-full p-4 bg-yellow-500 text-slate-900 font-bold rounded-xl shadow-lg hover:bg-yellow-400 transition">Login</button>
            <p class="text-sm text-gray-400 mt-4"><span id="toggle-text">ගිණුමක් නොමැතිද?</span> <button onclick="toggleAuthMode()" id="toggle-btn" class="text-yellow-500 font-bold">Register</button></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden min-h-screen p-6 pb-24">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-500 sinhala-font">A/L Fast Track</h1>
            <button onclick="handleLogout()" class="text-red-400 text-xs bg-red-400/10 px-3 py-1 rounded-lg">Logout</button>
        </header>
        <div class="countdown-box p-6 rounded-3xl mb-8 shadow-2xl text-slate-900">
            <h2 class="text-center font-bold text-sm uppercase mb-3 italic">2026 A/L විභාගයට තව...</h2>
            <div class="flex justify-around items-center">
                <div class="text-center"><span id="cd-days" class="text-4xl font-black block">00</span><span class="text-[10px] font-bold">Days</span></div>
                <div class="text-3xl font-bold">:</div>
                <div class="text-center"><span id="cd-hours" class="text-4xl font-black block">00</span><span class="text-[10px] font-bold">Hours</span></div>
                <div class="text-3xl font-bold">:</div>
                <div class="text-center"><span id="cd-mins" class="text-4xl font-black block">00</span><span class="text-[10px] font-bold">Mins</span></div>
            </div>
        </div>
        <div id="dashboard-content">
            <div class="space-y-4">
                <div onclick="openSubject('Media Studies')" class="glass-card p-5 rounded-2xl flex items-center cursor-pointer">
                    <div class="bg-purple-600 p-4 rounded-xl mr-4"><i class="fas fa-video"></i></div>
                    <span class="text-lg font-bold">Media Studies</span>
                </div>
                <div onclick="openSubject('Buddhist Civilization')" class="glass-card p-5 rounded-2xl flex items-center cursor-pointer">
                    <div class="bg-orange-600 p-4 rounded-xl mr-4"><i class="fas fa-dharmachakra"></i></div>
                    <span class="text-lg font-bold">Buddhist Civilization</span>
                </div>
                <div onclick="openSubject('Political Science')" class="glass-card p-5 rounded-2xl flex items-center cursor-pointer">
                    <div class="bg-blue-600 p-4 rounded-xl mr-4"><i class="fas fa-gavel"></i></div>
                    <span class="text-lg font-bold">Political Science</span>
                </div>
            </div>
        </div>
        <!-- Calendar View -->
        <div id="calendar-view" class="hidden">
            <h2 class="text-xl font-bold mb-6 text-yellow-500 sinhala-font">Exam Calendar - 2026</h2>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-yellow-500 mb-4"><h3>විභාගය ආරම්භය</h3><p class="text-sm text-gray-400">2026 නොවැම්බර් 25 (අනුමාන)</p></div>
        </div>
    </div>

    <!-- Subject Screen -->
    <div id="subject-screen" class="hidden min-h-screen p-6 pb-24">
        <button onclick="backToDashboard()" class="mb-6 text-gray-400"><i class="fas fa-arrow-left"></i> ආපසු</button>
        <h1 id="selected-subject-name" class="text-3xl font-bold text-yellow-500 mb-6">Subject</h1>
        <div class="flex space-x-2 mb-6 bg-slate-800 p-1 rounded-xl">
            <button onclick="showTab('papers')" id="btn-papers" class="flex-1 py-3 rounded-lg font-bold bg-yellow-500 text-slate-900">Papers</button>
            <button onclick="showTab('quiz')" id="btn-quiz" class="flex-1 py-3 rounded-lg font-bold text-gray-400">Quiz</button>
        </div>
        <div id="papers" class="tab-content active-tab space-y-3"></div>
        <div id="quiz" class="tab-content">
            <div id="lesson-list" class="space-y-4"></div>
            <div id="quiz-area" class="hidden space-y-6"></div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/10 flex justify-around p-4">
        <button onclick="navClick('home')" class="text-yellow-500 flex flex-col items-center"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></button>
        <button onclick="navClick('calendar')" class="text-gray-400 flex flex-col items-center"><i class="fas fa-calendar-alt"></i><span class="text-[10px]">Calendar</span></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_10UzdkgZPlu-P361PYbEQjTwbKjjWx0",
            authDomain: "al-fast-track.firebaseapp.com",
            projectId: "al-fast-track",
            storageBucket: "al-fast-track.firebasestorage.app",
            messagingSenderId: "272353911468",
            appId: "1:272353911468:web:07c22eb0c9f167fce37509"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const pastPapersData = {
            "Media Studies": [{year:"2024/25 Paper", link:"#"}, {year:"2023 Paper", link:"#"}, {year:"2022 Paper", link:"#"}, {year:"2021 Paper", link:"#"}, {year:"2020 Paper", link:"#"}],
            "Buddhist Civilization": [{year:"2024/25 Paper", link:"#"}, {year:"2023 Paper", link:"#"}, {year:"2022 Paper", link:"#"}, {year:"2021 Paper", link:"#"}, {year:"2020 Paper", link:"#"}],
            "Political Science": [{year:"2024/25 Paper", link:"#"}, {year:"2023 Paper", link:"#"}, {year:"2022 Paper", link:"#"}, {year:"2021 Paper", link:"#"}, {year:"2020 Paper", link:"#"}]
        };

        const allQuizData = {
            "Media Studies": {
                "Unit 01: සන්නිවේදනය": [{q:"සන්නිවේදනයේ මූලික ඒකකය?", options:["සංකේතය","භාෂාව","මාධ්‍ය","පණිවිඩය"], correct:0}],
                "Unit 02: ජන සන්නිවේදනය": [{q:"මුද්‍රණ කලාවේ පියා?", options:["ගූටන්බර්ග්","එඩිසන්","ගැලීලියෝ","කැක්ස්ටන්"], correct:0}],
                "Unit 03: මාධ්‍ය නීතිය": [{q:"RTI පනත ලැබුණේ?", options:["2016","2000","2020","2005"], correct:0}]
            },
            "Buddhist Civilization": {
                "Unit 01: භාරතීය පසුබිම": [{q:"ප්‍රබල රාජාණ්ඩුව?", options:["මගධය","කෝසලය","වත්සය","අවන්තිය"], correct:0}],
                "Unit 02: ආර්ථික දර්ශනය": [{q:"ධනය රැස් කිරීම උපමා කර ඇත්තේ?", options:["මීමැස්සෙකුට","ගඟකට","ගින්නකට","කන්දකට"], correct:0}],
                "Unit 03: ලාංකීය ශිෂ්ටාචාරය": [{q:"ප්‍රථම දාගැබ?", options:["ථූපාරාමය","රුවන්වැලිසෑය","මිරිසවැටිය","අභයගිරිය"], correct:0}]
            },
            "Political Science": {
                "Unit 01: ස්වභාවය": [{q:"දේශපාලන විද්‍යාවේ පියා?", options:["ඇරිස්ටෝටල්","ප්ලේටෝ","සොක්‍රටීස්","හොබ්ස්"], correct:0}],
                "Unit 02: ප්‍රජාතන්ත්‍රවාදය": [{q:"සෘජු ප්‍රජාතන්ත්‍රවාදය පවතින්නේ?", options:["ස්විට්සර්ලන්තය","ඇමරිකාව","ඉන්දියාව","බ්‍රිතාන්‍ය"], correct:0}],
                "Unit 03: ශ්‍රී ලංකාව": [{q:"සර්වජන ඡන්ද බලය ලැබුණේ?", options:["1931","1948","1972","1978"], correct:0}]
            }
        };

        let isLoginMode = true;
        let currentSubject = "";

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('auth-btn').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('register-fields').classList.toggle('hidden');
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nameField = document.getElementById('reg-name');
            const name = nameField ? nameField.value : "";
            if(!email || !password) return alert("විස්තර ඇතුළත් කරන්න.");
            try {
                if(isLoginMode) await auth.signInWithEmailAndPassword(email, password);
                else {
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection("users").doc(res.user.uid).set({name, email});
                }
            } catch(e) { alert("Error: " + e.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
            }
        });

        function handleLogout() { auth.signOut().then(() => location.reload()); }

        function updateCountdown() {
            const gap = new Date("Nov 25, 2026").getTime() - new Date().getTime();
            document.getElementById("cd-days").innerText = Math.floor(gap / (1000*60*60*24));
            document.getElementById("cd-hours").innerText = Math.floor((gap % (1000*60*60*24)) / (1000*60*60));
            document.getElementById("cd-mins").innerText = Math.floor((gap % (1000*60*60)) / (1000*60));
        }
        setInterval(updateCountdown, 60000); updateCountdown();

        function navClick(tab) {
            document.getElementById('dashboard-content').classList.toggle('hidden', tab === 'calendar');
            document.getElementById('calendar-view').classList.toggle('hidden', tab === 'home');
        }

        function openSubject(name) {
            currentSubject = name;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('subject-screen').classList.remove('hidden');
            document.getElementById('selected-subject-name').innerText = name;
            document.getElementById('papers').innerHTML = pastPapersData[name].map(p => `
                <div class="glass-card p-4 rounded-xl flex justify-between items-center">
                    <span>${p.year}</span><i class="fas fa-file-pdf text-red-500"></i>
                </div>`).join('');
            showLessonList();
        }

        function showLessonList() {
            const lessons = allQuizData[currentSubject];
            const listDiv = document.getElementById('lesson-list');
            listDiv.innerHTML = `<h2 class="text-xl font-bold mb-4 opacity-50">Units</h2>`;
            Object.keys(lessons).forEach(unit => {
                listDiv.innerHTML += `<div onclick="startQuiz('${unit}')" class="glass-card p-5 rounded-2xl cursor-pointer border-l-4 border-yellow-500 mb-3">${unit}</div>`;
            });
            document.getElementById('quiz-area').classList.add('hidden');
            listDiv.classList.remove('hidden');
        }

        function startQuiz(unit) {
            const questions = allQuizData[currentSubject][unit];
            const quizArea = document.getElementById('quiz-area');
            document.getElementById('lesson-list').classList.add('hidden');
            quizArea.classList.remove('hidden');
            quizArea.innerHTML = `<button onclick="showLessonList()" class="mb-4 text-xs">Back</button>`;
            questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = "glass-card p-5 rounded-2xl mb-4";
                card.innerHTML = `<p class="mb-3 font-bold">${i+1}. ${q.q}</p>`;
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-3 mb-2 rounded-xl bg-slate-800/50 border border-white/5";
                    btn.innerText = opt;
                    btn.onclick = () => btn.classList.add(idx === q.correct ? 'bg-green-600' : 'bg-red-600');
                    card.appendChild(btn);
                });
                quizArea.appendChild(card);
            });
        }

        function backToDashboard() {
            document.getElementById('subject-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function showTab(tab) {
            document.getElementById('papers').classList.toggle('active-tab', tab === 'papers');
            document.getElementById('quiz').classList.toggle('active-tab', tab === 'quiz');
            document.getElementById('btn-papers').className = tab === 'papers' ? "flex-1 py-3 rounded-lg font-bold bg-yellow-500 text-slate-900" : "flex-1 py-3 rounded-lg font-bold text-gray-400";
            document.getElementById('btn-quiz').className = tab === 'quiz' ? "flex-1 py-3 rounded-lg font-bold bg-yellow-500 text-slate-900" : "flex-1 py-3 rounded-lg font-bold text-gray-400";
        }
    </script>
</body>
</html>
