<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Fast Track - 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Abhaya+Libre:wght@700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: white; }
        .sinhala-font { font-family: 'Abhaya Libre', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .countdown-box { background: linear-gradient(135deg, #f59e0b, #d97706); }
    </style>
</head>
<body>
    <div id="auth-screen" class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-extrabold text-yellow-500 mb-2">A/L Fast Track</h1>
        <div class="w-full max-w-sm glass-card p-8 rounded-3xl shadow-2xl">
            <h2 id="auth-title" class="text-xl font-bold mb-6">Login</h2>
            <div id="register-fields" class="hidden">
                <input type="text" id="reg-name" placeholder="ඔබේ නම" class="w-full p-4 mb-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-yellow-500 text-white">
            </div>
            <input type="email" id="auth-email" placeholder="Email ලිපිනය" class="w-full p-4 mb-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-yellow-500 text-white">
            <input type="password" id="auth-password" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-yellow-500 text-white">
            <button onclick="handleAuth()" id="auth-btn" class="w-full p-4 bg-yellow-500 text-slate-900 font-bold rounded-xl shadow-lg hover:bg-yellow-400 transition">Login</button>
            <p class="text-sm text-gray-400 mt-4">ගිණුමක් නොමැතිද? <button onclick="toggleAuthMode()" id="toggle-btn" class="text-yellow-500 font-bold">Register</button></p>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen p-6 pb-24">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-500 sinhala-font">A/L Fast Track</h1>
            <button onclick="handleLogout()" class="text-red-400 text-xs bg-red-400/10 px-3 py-1 rounded-lg">Logout</button>
        </header>
        <div class="countdown-box p-6 rounded-3xl mb-8 shadow-2xl text-slate-900">
            <h2 class="text-center font-bold text-sm uppercase mb-3 italic">2026 A/L විභාගයට තව...</h2>
            <div class="flex justify-around items-center">
                <div class="text-center"><span id="cd-days" class="text-4xl font-black block">00</span><span class="text-[10px] font-bold">Days</span></div>
                <div class="text-3xl font-bold">:</div>
                <div class="text-center"><span id="cd-hours" class="text-4xl font-black block">00</span><span class="text-[10px] font-bold">Hours</span></div>
                <div class="text-3xl font-bold">:</div>
                <div class="text-center"><span id="cd-mins" class="text-4xl font-black block">00</span><span class="text-[10px] font-bold">Mins</span></div>
            </div>
        </div>
        <div id="dashboard-content">
            <div class="space-y-4">
                <div onclick="openSubject('Media Studies')" class="glass-card p-5 rounded-2xl flex items-center cursor-pointer"><div class="bg-purple-600 p-4 rounded-xl mr-4"><i class="fas fa-video"></i></div><span class="text-lg font-bold">Media Studies</span></div>
                <div onclick="openSubject('Buddhist Civilization')" class="glass-card p-5 rounded-2xl flex items-center cursor-pointer"><div class="bg-orange-600 p-4 rounded-xl mr-4"><i class="fas fa-dharmachakra"></i></div><span class="text-lg font-bold">Buddhist Civilization</span></div>
                <div onclick="openSubject('Political Science')" class="glass-card p-5 rounded-2xl flex items-center cursor-pointer"><div class="bg-blue-600 p-4 rounded-xl mr-4"><i class="fas fa-gavel"></i></div><span class="text-lg font-bold">Political Science</span></div>
            </div>
        </div>
        <div id="calendar-view" class="hidden">
            <h2 class="text-xl font-bold mb-6 text-yellow-500 sinhala-font">Exam Calendar - 2026</h2>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-yellow-500 mb-4"><h3>විභාගය ආරම්භය</h3><p class="text-sm text-gray-400">2026 නොවැම්බර් 25 (අනුමාන)</p></div>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-blue-500 mb-4"><h3>අයදුම්පත් කැඳවීම</h3><p class="text-sm text-gray-400">අගෝස්තු - සැප්තැම්බර්</p></div>
        </div>
    </div>

    <div id="subject-screen" class="hidden min-h-screen p-6 pb-24">
        <button onclick="backToDashboard()" class="mb-6 text-gray-400"><i class="fas fa-arrow-left"></i> ආපසු</button>
        <h1 id="selected-subject-name" class="text-3xl font-bold text-yellow-500 mb-6">Subject</h1>
        <div class="flex space-x-2 mb-6 bg-slate-800 p-1 rounded-xl">
            <button onclick="showTab('papers')" id="btn-papers" class="flex-1 py-3 rounded-lg font-bold bg-yellow-500 text-slate-900">Papers</button>
            <button onclick="showTab('quiz')" id="btn-quiz" class="flex-1 py-3 rounded-lg font-bold text-gray-400">Quiz</button>
        </div>
        <div id="papers" class="tab-content active-tab text-center py-10 text-gray-500 italic">ප්‍රශ්න පත්‍ර ළඟදීම...</div>
        <div id="quiz" class="tab-content">
            <div id="lesson-list" class="space-y-4"></div>
            <div id="quiz-area" class="hidden space-y-6"></div>
        </div>
    </div>

    <div id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/10 flex justify-around p-4">
        <button onclick="navClick('home')" class="text-yellow-500 flex flex-col items-center"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></button>
        <button onclick="navClick('calendar')" class="text-gray-400 flex flex-col items-center"><i class="fas fa-calendar-alt"></i><span class="text-[10px]">Calendar</span></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_10UzdkgZPlu-P361PYbEQjTwbKjjWx0",
            authDomain: "al-fast-track.firebaseapp.com",
            projectId: "al-fast-track",
            storageBucket: "al-fast-track.firebasestorage.app",
            messagingSenderId: "272353911468",
            appId: "1:272353911468:web:07c22eb0c9f167fce37509"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ---// ======= 📚 PAST PAPERS DATA =======
        const pastPapersData = {
            "Media Studies": [
                { year: "2024/25 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2023 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2022 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2021 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2020 A/L Paper", link: "https://එකතු_කරන්න" }
            ],
            "Buddhist Civilization": [
                { year: "2024/25 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2023 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2022 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2021 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2020 A/L Paper", link: "https://එකතු_කරන්න" }
            ],
            "Political Science": [
                { year: "2024/25 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2023 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2022 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2021 A/L Paper", link: "https://එකතු_කරන්න" },
                { year: "2020 A/L Paper", link: "https://එකතු_කරන්න" }
            ]
        };
        // ======= ⚙️ APP LOGIC (මේ ටික අනිවාර්යයෙන්ම දාන්න) =======
        let isLoginMode = true;
        let currentSubject = "";

        // Login සහ Register අතර මාරු වීමට
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Login" : "Register";
            const toggleBtn = document.getElementById('toggle-btn');
            const toggleText = document.getElementById('toggle-text');
            const regFields = document.getElementById('register-fields');
            const authBtn = document.getElementById('auth-btn');

            if (isLoginMode) {
                toggleText.innerText = "ගිණුමක් නොමැතිද?";
                toggleBtn.innerText = "Register";
                regFields.classList.add('hidden');
                authBtn.innerText = "Login";
            } else {
                toggleText.innerText = "දැනටමත් ගිණුමක් තිබේද?";
                toggleBtn.innerText = "Login";
                regFields.classList.remove('hidden');
                authBtn.innerText = "Register";
            }
        }

        // Firebase හරහා Register/Login වීම
        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nameField = document.getElementById('reg-name');
            const name = nameField ? nameField.value : "";

            if (!email || !password) return alert("කරුණාකර සියල්ල පුරවන්න.");

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    if (!name) return alert("නම ඇතුළත් කරන්න.");
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection("users").doc(res.user.uid).set({ name, email });
                }
            } catch (e) {
                alert("ගැටලුවක් පවතී: " + e.message);
            }
        }

        // Dashboard එක පෙන්වීම
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
            }
        });

        function handleLogout() { auth.signOut().then(() => location.reload()); }

        // Countdown Timer
        function updateCountdown() {
            const examDate = new Date("Nov 25, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const gap = examDate - now;
            const d = Math.floor(gap / (1000 * 60 * 60 * 24));
            const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("cd-days").innerText = d;
            document.getElementById("cd-hours").innerText = h;
            document.getElementById("cd-mins").innerText = m;
        }
        setInterval(updateCountdown, 60000); updateCountdown();

        // Navigation
        function navClick(tab) {
            if (tab === 'home') {
                document.getElementById('dashboard-content').classList.remove('hidden');
                document.getElementById('calendar-view').classList.add('hidden');
            } else {
                document.getElementById('dashboard-content').classList.add('hidden');
                document.getElementById('calendar-view').classList.remove('hidden');
            }
        }

        function openSubject(name) {
            currentSubject = name;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('subject-screen').classList.remove('hidden');
            document.getElementById('selected-subject-name').innerText = name;
            
            const pDiv = document.getElementById('papers');
            pDiv.innerHTML = pastPapersData[name].map(p => `
                <a href="${p.link}" target="_blank" class="glass-card p-4 rounded-xl flex justify-between items-center mb-3">
                    <span>${p.year}</span><i class="fas fa-file-pdf text-red-500"></i>
                </a>`).join('');
            showLessonList();
        }

        function showLessonList() {
            const listDiv = document.getElementById('lesson-list');
            const lessons = allQuizData[currentSubject];
            listDiv.innerHTML = `<h2 class="text-xl font-bold mb-4 opacity-50 sinhala-font">පාඩම් මාලාව</h2>`;
            Object.keys(lessons).forEach(unit => {
                listDiv.innerHTML += `<div onclick="startQuiz('${unit}')" class="glass-card p-5 rounded-2xl cursor-pointer border-l-4 border-yellow-500 mb-3 shadow-lg">${unit}</div>`;
            });
            document.getElementById('quiz-area').classList.add('hidden');
            listDiv.classList.remove('hidden');
        }

        function startQuiz(unit) {
            const quizArea = document.getElementById('quiz-area');
            const questions = allQuizData[currentSubject][unit];
            document.getElementById('lesson-list').classList.add('hidden');
            quizArea.classList.remove('hidden');
            quizArea.innerHTML = `<button onclick="showLessonList()" class="text-xs text-gray-400 mb-4"><i class="fas fa-arrow-left"></i> ආපසු</button>`;
            
            questions.forEach((qObj, i) => {
                const card = document.createElement('div');
                card.className = "glass-card p-5 rounded-2xl mb-6 shadow-xl";
                card.innerHTML = `<p class="mb-4 font-bold text-white">${i+1}. ${qObj.q}</p>`;
                qObj.options.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 mb-2 rounded-xl bg-slate-800/50 border border-white/5";
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if(optIdx === qObj.correct) btn.classList.add('bg-green-600');
                        else btn.classList.add('bg-red-600');
                    };
                    card.appendChild(btn);
                });
                quizArea.appendChild(card);
            });
        }

        function backToDashboard() {
            document.getElementById('subject-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active-tab');
            const btnPapers = document.getElementById('btn-papers');
            const btnQuiz = document.getElementById('btn-quiz');
            if (tabId === 'papers') {
                btnPapers.classList.add('bg-yellow-500', 'text-slate-900');
                btnQuiz.classList.remove('bg-yellow-500', 'text-slate-900');
                btnQuiz.classList.add('text-gray-400');
            } else {
                btnQuiz.classList.add('bg-yellow-500', 'text-slate-900');
                btnPapers.classList.remove('bg-yellow-500', 'text-slate-900');
                btnPapers.classList.add('text-gray-400');
            }
        }

        // ======= 📝 MCQ QUIZ DATA =======
        const allQuizData = {
            "Media Studies": {
                "Unit 01: සන්නිවේදනය හඳුන්වාදීම": [
                    { q: "මානව සන්නිවේදනයේ මූලිකම ඒකකය කුමක්ද?", options: ["සංකේතය", "භාෂාව", "මාධ්‍යය", "පණිවිඩය"], correct: 0 },
                    { q: "සන්නිවේදනයේ 'රේඛීය ආකෘතිය' (Linear Model) මුලින්ම ඉදිරිපත් කළේ කවුද?", options: ["ලැස්වෙල්", "ඇරිස්ටෝටල්", "ෂැනන් සහ වීවර්", "විල්බර් ශ්‍රාම්"], correct: 1 },
                    { q: "අන්තර් පුද්ගල සන්නිවේදනය යනු කුමක්ද?", options: ["තමා සමඟම කරන සන්නිවේදනය", "දෙදෙනෙකු අතර සිදුවන සන්නිවේදනය", "කණ්ඩායමක් සමඟ කරන සන්නිවේදනය", "ගුවන් විදුලි සන්නිවේදනය"], correct: 1 },
                    { q: "සන්නිවේදන ක්‍රියාවලියේ ඇතිවන බාධක හැඳින්වීමට භාවිත කරන පදය?", options: ["ප්‍රතිපෝෂණය", "ඝෝෂාව (Noise)", "සංකේතනය", "විසංකේතනය"], correct: 1 },

        // ======= ⚙️ CORE LOGIC =======
        let isLoginMode = true;
        let currentSubject = "";

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('auth-btn').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('register-fields').classList.toggle('hidden');
        }
// Firebase හරහා Register සහ Login කිරීමේ ප්‍රධාන Function එක
        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nameField = document.getElementById('reg-name');
            const name = nameField ? nameField.value : "";

            if (!email || !password) {
                alert("කරුණාකර Email සහ Password ඇතුළත් කරන්න.");
                return;
            }

            try {
                if (isLoginMode) {
                    // Login වන අවස්ථාව
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    // Register වන අවස්ථාව
                    if (!name) {
                        alert("කරුණාකර ඔබේ නම ඇතුළත් කරන්න.");
                        return;
                    }
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    // Firestore එකේ user ගේ නම save කිරීම
                    await db.collection("users").doc(res.user.uid).set({
                        name: name,
                        email: email
                    });
                }
            } catch (error) {
                // මොකක් හරි වැරැද්දක් වුණොත් ඒක alert එකකින් පෙන්වනවා
                alert("ගැටලුවක් පවතී: " + error.message);
            }
        }

        // පරිශීලකයා ලොග් වී ඇත්දැයි නිරන්තරයෙන් පරීක්ෂා කිරීම
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
            }
        });

        // Logout වීමේ function එක
        function handleLogout() {
            auth.signOut().then(() => {
                location.reload();
            });

            try {
                if(isLoginMode) await auth.signInWithEmailAndPassword(email, password);
                else {
                    const res = await auth.createUserWithEmailAndPassword(email, password);

        function handleLogout() { auth.signOut().then(() => location.reload()); }

        function updateCountdown() {
            const examDate = new Date("Nov 25, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const gap = examDate - now;
            const d = Math.floor(gap / (1000 * 60 * 60 * 24));
            const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("cd-days").innerText = d;
            document.getElementById("cd-hours").innerText = h;
            document.getElementById("cd-mins").innerText = m;
        }
        setInterval(updateCountdown, 60000); updateCountdown();

        function navClick(tab) {
            if(tab === 'home') {
                document.getElementById('dashboard-content').classList.remove('hidden');
                document.getElementById('calendar-view').classList.add('hidden');
            } else {
                document.getElementById('dashboard-content').classList.add('hidden');
                document.getElementById('calendar-view').classList.remove('hidden');
            }
        }

        function openSubject(name) {
            currentSubject = name;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('subject-screen').classList.remove('hidden');
            document.getElementById('selected-subject-name').innerText = name;
            
            // Load Papers
            const pDiv = document.getElementById('papers');
            pDiv.innerHTML = pastPapersData[name].map(p => `
                <a href="${p.link}" target="_blank" class="glass-card p-4 rounded-xl flex justify-between items-center mb-3">
                    <span>${p.year}</span><i class="fas fa-file-pdf text-red-500"></i>
                </a>`).join('');
            
            showLessonList();
        }

        function showLessonList() {
            const listDiv = document.getElementById('lesson-list');
            const lessons = allQuizData[currentSubject];
            listDiv.innerHTML = `<h2 class="text-xl font-bold mb-4 opacity-50">Units</h2>`;
            Object.keys(lessons).forEach(unit => {
                listDiv.innerHTML += `<div onclick="startQuiz('${unit}')" class="glass-card p-5 rounded-2xl cursor-pointer border-l-4 border-yellow-500 mb-3 shadow-lg">${unit}</div>`;
            });
            document.getElementById('quiz-area').classList.add('hidden');
            listDiv.classList.remove('hidden');
        }

        function startQuiz(unit) {
            const quizArea = document.getElementById('quiz-area');
            const questions = allQuizData[currentSubject][unit];
            document.getElementById('lesson-list').classList.add('hidden');
            quizArea.classList.remove('hidden');
            quizArea.innerHTML = `<button onclick="showLessonList()" class="text-xs text-gray-400 mb-4"><i class="fas fa-arrow-left"></i> Back</button>`;
            
            questions.forEach((qObj, i) => {
                const card = document.createElement('div');
                card.className = "glass-card p-5 rounded-2xl mb-6 shadow-xl";
                card.innerHTML = `<p class="mb-4 font-bold text-white">${i+1}. ${qObj.q}</p>`;
                qObj.options.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 mb-2 rounded-xl bg-slate-800/50 border border-white/5";
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if(optIdx === qObj.correct) btn.classList.add('bg-green-600');
                        else btn.classList.add('bg-red-600');
                    };
                    card.appendChild(btn);
                });
                quizArea.appendChild(card);
            });
        }

        function backToDashboard() {
            document.getElementById('subject-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active-tab');
