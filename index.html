<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Fast Track Pro | KD Creation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #fbbf24; }
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', sans-serif; background: #020617; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .btn-grad { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); transition: 0.3s; color: black; font-weight: 800; }
        .active-nav { color: var(--primary); filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6)); }
        .premium-card { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); border: 1px solid #4338ca; }
        #chatbot-window { transition: 0.3s ease-in-out; transform: translateY(120%); visibility: hidden; }
        #chatbot-window.open { transform: translateY(0); visibility: visible; }
    </style>
</head>
<body class="pb-24">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6 bg-slate-950">
        <div class="w-full max-w-md glass p-10 text-center">
            <h1 class="text-3xl font-black italic mb-2">FAST TRACK <span class="text-amber-500">PRO</span></h1>
            <p id="auth-title" class="text-[10px] tracking-widest text-slate-500 uppercase mb-8">Sign In to Study</p>
            
            <div id="reg-fields" class="hidden">
                <input type="text" id="user-name" placeholder="Full Name" class="w-full p-4 mb-4 glass bg-white/5 outline-none focus:border-amber-500">
            </div>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 mb-4 glass bg-white/5 outline-none focus:border-amber-500">
            <input type="password" id="pass" placeholder="Password" class="w-full p-4 mb-6 glass bg-white/5 outline-none focus:border-amber-500">

            <button onclick="handleAuth()" class="w-full p-4 btn-grad rounded-2xl mb-4 uppercase">Continue</button>
            <button onclick="toggleAuth()" id="toggle-txt" class="text-xs text-slate-400">Need an account? <span class="text-amber-500">Sign Up</span></button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="dashboard" class="hidden p-6 max-w-2xl mx-auto">
        
        <!-- HOME VIEW -->
        <div id="home-view">
            <header class="flex justify-between items-center mb-8">
                <div class="flex items-center gap-4">
                    <img id="header-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-12 h-12 rounded-xl border border-white/10">
                    <div>
                        <h2 id="display-name" class="font-bold text-white">Student</h2>
                        <div class="flex items-center gap-1">
                            <p class="text-[9px] text-amber-500 font-bold uppercase">Verified Candidate</p>
                            <i class="fas fa-check-circle text-green-500 text-[10px]"></i>
                        </div>
                    </div>
                </div>
                <div class="glass px-4 py-2 border-amber-500/20">
                    <span id="user-points" class="font-black text-amber-400">0</span> <span class="text-[8px] text-slate-500 font-bold">XP</span>
                </div>
            </header>

            <div class="grid grid-cols-1 gap-4" id="subjects-container"></div>
        </div>

        <!-- LEADERBOARD VIEW -->
        <div id="rank-view" class="hidden">
            <h2 class="text-2xl font-black italic mb-6">TOP <span class="text-amber-500">STUDENTS</span></h2>
            <div id="leaderboard-list" class="space-y-3">
                <!-- Data from Firestore -->
            </div>
        </div>

        <!-- PROFILE VIEW -->
        <div id="profile-view" class="hidden">
            <div class="text-center mb-8">
                <img id="profile-img-big" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-24 h-24 mx-auto rounded-[2rem] border-4 border-white/5 mb-4">
                <h2 id="p-name" class="text-xl font-black">Student Name</h2>
                <div class="flex items-center justify-center gap-1 mb-6">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Verified Candidate</p>
                    <i class="fas fa-check-circle text-green-500"></i>
                </div>

                <!-- Premium Section -->
                <div class="premium-card p-6 rounded-3xl text-left mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-black text-amber-400 tracking-tighter">PREMIUM SUBSCRIPTION</h4>
                        <i class="fas fa-crown text-amber-500"></i>
                    </div>
                    <ul class="text-[10px] space-y-2 mb-6 text-slate-300">
                        <li><i class="fas fa-star mr-2 text-amber-500"></i> සියලුම පසුගිය විභාග ප්‍රශ්න පත්‍ර (PDF)</li>
                        <li><i class="fas fa-star mr-2 text-amber-500"></i> Unlimited AI Chat Assistant</li>
                        <li><i class="fas fa-star mr-2 text-amber-500"></i> Ads Free Experience</li>
                    </ul>
                    <button onclick="alert('Payment Gateway Loading...')" class="w-full py-3 bg-white text-black rounded-xl font-black text-xs uppercase">Get Premium - Rs.990</button>
                </div>

                <!-- Profile Actions -->
                <div class="space-y-2 mb-8">
                    <button onclick="changePassword()" class="w-full glass p-4 text-xs font-bold flex justify-between">Change Password <i class="fas fa-key"></i></button>
                    <button onclick="logout()" class="w-full glass p-4 text-xs font-bold text-red-500 flex justify-between">Sign Out <i class="fas fa-sign-out-alt"></i></button>
                </div>

                <!-- Social & Dev -->
                <div class="flex justify-center gap-4 mb-6">
                    <a href="#" class="w-10 h-10 glass flex items-center justify-center text-green-500"><i class="fab fa-whatsapp"></i></a>
                    <a href="#" class="w-10 h-10 glass flex items-center justify-center text-blue-500"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="w-10 h-10 glass flex items-center justify-center text-red-500"><i class="fab fa-youtube"></i></a>
                </div>
                <p class="text-[9px] text-slate-600 font-black uppercase">App Developer: <span class="text-amber-500">KD Creation</span></p>
            </div>
        </div>

        <!-- SUBMENU & QUIZ -->
        <div id="submenu-view" class="hidden"></div>
        <div id="quiz-view" class="hidden"></div>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-window" class="fixed bottom-24 right-6 left-6 z-[60] glass border-amber-500/30 flex flex-col h-[450px] max-w-md mx-auto overflow-hidden">
        <div class="p-4 bg-amber-500 text-black flex justify-between items-center">
            <span class="font-black text-xs uppercase">AI Tutor Assistant</span>
            <button onclick="toggleChat()"><i class="fas fa-times"></i></button>
        </div>
        <div id="chat-msgs" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs"></div>
        <div class="p-4 border-t border-white/5 flex gap-2">
            <input type="text" id="chat-input" class="flex-1 bg-white/5 rounded-xl px-4 py-2 outline-none text-xs" placeholder="ප්‍රශ්නය මෙතැන ලියන්න...">
            <button onclick="askBot()" class="w-10 h-10 btn-grad rounded-xl"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <button onclick="toggleChat()" class="fixed bottom-28 right-6 w-14 h-14 btn-grad rounded-2xl shadow-2xl z-[55] flex items-center justify-center">
        <i class="fas fa-robot text-xl"></i>
    </button>

    <!-- NAV BAR -->
    <nav id="navbar" class="hidden fixed bottom-6 left-6 right-6 h-20 glass flex justify-around items-center z-50">
        <button onclick="nav('home')" id="n-home" class="p-4 active-nav"><i class="fas fa-th-large"></i></button>
        <button onclick="nav('rank')" id="n-rank" class="p-4 text-slate-600"><i class="fas fa-chart-bar"></i></button>
        <button onclick="nav('profile')" id="n-profile" class="p-4 text-slate-600"><i class="fas fa-user"></i></button>
    </nav>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyB_10UzdkgZPlu-P361PYbEQjTwbKjjWx0",
            authDomain: "al-fast-track-2026.firebaseapp.com",
            projectId: "al-fast-track-2026",
            storageBucket: "al-fast-track-2026.appspot.com",
            messagingSenderId: "272353911468",
            appId: "1:272353911468:web:07c22eb0c9f167fce37509"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // AUTH FUNCTIONS
        function toggleAuth() { 
            const isReg = document.getElementById('reg-fields').classList.toggle('hidden');
            document.getElementById('auth-title').innerText = isReg ? "Register New Account" : "Sign In to Study";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const name = document.getElementById('user-name').value;
            const isReg = !document.getElementById('reg-fields').classList.contains('hidden');

            try {
                if(isReg) {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection("users").doc(res.user.uid).set({ name, points: 0, photo: "", premium: false });
                } else { await auth.signInWithEmailAndPassword(email, pass); }
            } catch(e) { alert(e.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('navbar').classList.remove('hidden');
                syncProfile(user.uid);
                loadLeaderboard();
            }
        });

        function syncProfile(uid) {
            db.collection("users").doc(uid).onSnapshot(doc => {
                const data = doc.data();
                document.getElementById('display-name').innerText = data.name;
                document.getElementById('p-name').innerText = data.name;
                document.getElementById('user-points').innerText = data.points || 0;
            });
        }

        // LEADERBOARD LOGIC
        async function loadLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            const snap = await db.collection("users").orderBy("points", "desc").limit(10).get();
            list.innerHTML = "";
            let i = 1;
            snap.forEach(doc => {
                const u = doc.data();
                list.innerHTML += `
                    <div class="glass p-4 flex justify-between items-center border-white/5">
                        <div class="flex items-center gap-4">
                            <span class="text-amber-500 font-black w-4">#${i++}</span>
                            <span class="font-bold text-sm">${u.name}</span>
                        </div>
                        <span class="text-xs font-black">${u.points} XP</span>
                    </div>`;
            });
        }

        // CHATBOT IMPROVED
        function toggleChat() { document.getElementById('chatbot-window').classList.toggle('open'); }

        async function askBot() {
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-msgs');
            const msg = input.value;
            if(!msg) return;

            chatBox.innerHTML += `<div class="bg-amber-500/20 p-3 rounded-2xl self-end ml-auto max-w-[80%]">${msg}</div>`;
            input.value = "";

            // Logic for AI simulation
            setTimeout(() => {
                let reply = "මට ඒ ගැන වැඩි විස්තර සොයා දෙන්න පුළුවන්. කරුණාකර ඒ ප්‍රශ්නය තවදුරටත් පැහැදිලි කරන්න.";
                if(msg.includes("කවුද") || msg.includes("who")) reply = "මම ඔයාගේ A/L Fast Track AI සහායකයා. ඔයාට උදව් කරන්න මම මෙතන ඉන්නවා.";
                
                chatBox.innerHTML += `<div class="bg-white/5 p-3 rounded-2xl mr-auto max-w-[80%]">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        // OTHER ACTIONS
        function changePassword() {
            const user = auth.currentUser;
            auth.sendPasswordResetEmail(user.email).then(() => alert("Password reset link එක ඔබේ Email එකට එව්වා."));
        }

        function nav(v) {
            ['home','rank','profile'].forEach(x => {
                document.getElementById(x+'-view').classList.add('hidden');
                document.getElementById('n-'+x).className = "p-4 text-slate-600";
            });
            document.getElementById(v+'-view').classList.remove('hidden');
            document.getElementById('n-'+v).className = "p-4 active-nav";
        }

        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
