<!-- කලින් code එකේ <style> කොටසට මේක දාන්න (නැත්නම් මුළු code එකම පහළ තියෙනවා) -->
<style>
    /* එකක් යට එකක් පිළිවෙලට තියෙන්න style එක */
    .subjects-list {
        display: flex;
        flex-direction: column;
        gap: 1rem; /* Cards අතර පරතරය */
    }
    
    .sub-card {
        width: 100%; /* Card එක සම්පූර්ණ පළල ගන්න */
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        transition: 0.3s all ease;
    }

    .sub-card:hover {
        background: rgba(251, 191, 36, 0.05);
        border-color: rgba(251, 191, 36, 0.3);
        transform: translateX(5px); /* Hover කළාම පොඩ්ඩක් දකුණට යනවා */
    }
</style>

<!-- Main App ඇතුළේ "ALL SUBJECTS LIST" කොටස මේ විදියට update කරන්න -->
<div id="home-view">
    <!-- ... කලින් header සහ countdown කොටස් ... -->

    <h3 class="text-[10px] font-black text-slate-500 mb-5 uppercase tracking-widest flex items-center gap-2">
        <span class="w-8 h-[1px] bg-slate-800"></span> තෝරාගත් විශයන් <span class="w-8 h-[1px] bg-slate-800"></span>
    </h3>
    
    <!-- මෙන්න මෙතන තමයි වෙනස් කළේ: grid-cols-1 දාලා flex-col කළා -->
    <div class="subjects-list" id="subjects-container">
        <!-- විශයන් auto-render වෙන්නේ මෙතනට -->
    </div>
</div>

<script>
    // JS එකේ renderSubjects function එක මේ විදියට වෙනස් කරන්න
    function renderSubjects() {
        const container = document.getElementById('subjects-container');
        container.innerHTML = ALL_SUBJECTS.map(sub => `
            <div onclick="openSubmenu('${sub.id}', '${sub.name}')" class="sub-card glass">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-amber-500/10 rounded-xl flex items-center justify-center text-amber-500 border border-amber-500/20">
                        <i class="fas ${sub.icon} text-lg"></i>
                    </div>
                    <div>
                        <p class="font-black text-[11px] uppercase tracking-wider">${sub.name}</p>
                        <p class="text-[8px] text-slate-500 font-bold uppercase">Tap to start learning</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">
                    <i class="fas fa-chevron-right text-[10px] text-slate-600"></i>
                </div>
            </div>
        `).join('');
    }
</script>
